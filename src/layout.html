<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- The hero background is the LCP element, so it is preloaded at high
       priority. Two sizes, media-gated so a phone never fetches the 1672px
       desktop file; these must stay in sync with the matching
       `max-width: 959px` rule in css/sections/hero.css. -->
  <link
    rel="preload"
    as="image"
    href="assets/images/hero-repair-mobile.webp"
    fetchpriority="high"
    media="(max-width: 959px)"
  />
  <link
    rel="preload"
    as="image"
    href="assets/images/hero-repair.webp"
    fetchpriority="high"
    media="(min-width: 960px)"
  />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/poppins-latin-400.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/poppins-latin-700.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/poppins-latin-800.woff2" crossorigin />

  <!-- main.js's imports, so the browser fetches the whole module graph in
       one parallel wave instead of discovering it one parse-step later. -->
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/modules/bind-config.js" />
  <link rel="modulepreload" href="js/modules/geo-location.js" />
  <link rel="modulepreload" href="js/modules/service-area-map.js" />
  <link rel="modulepreload" href="js/modules/local-number.js" />
  <link rel="modulepreload" href="js/modules/star-rating.js" />
  <link rel="modulepreload" href="js/modules/mobile-call-bar.js" />
  <link rel="modulepreload" href="js/modules/call-tracking.js" />
  <link rel="modulepreload" href="js/modules/call-by.js" />

  <title>{{seo.title}}</title>
  <meta name="description" content="{{seo.description}}" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="{{seo.canonicalUrl}}" />
  <meta name="theme-color" content="#1657ff" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="assets/images/favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{seo.siteName}}" />
  <meta property="og:locale" content="{{seo.locale}}" />
  <meta property="og:title" content="{{seo.title}}" />
  <meta property="og:description" content="{{seo.description}}" />
  <meta property="og:url" content="{{seo.canonicalUrl}}" />
  <meta property="og:image" content="{{seo.ogImageUrl}}" />
  <meta property="og:image:secure_url" content="{{seo.ogImageUrl}}" />
  <meta property="og:image:type" content="{{seo.ogImageType}}" />
  <meta property="og:image:width" content="{{seo.ogImageWidth}}" />
  <meta property="og:image:height" content="{{seo.ogImageHeight}}" />
  <meta property="og:image:alt" content="{{seo.ogImageAlt}}" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{seo.title}}" />
  <meta name="twitter:description" content="{{seo.description}}" />
  <meta name="twitter:image" content="{{seo.ogImageUrl}}" />
  <meta name="twitter:image:alt" content="{{seo.ogImageAlt}}" />

  <script type="application/ld+json">{{jsonLd}}</script>

  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

<!-- include:icons -->

<!-- include:header -->

  <main id="main-content">
<!-- include:hero -->

    <section class="content-with-sidebar">
      <div class="container content-grid">
        <div class="content-main">
<!-- include:services -->

<!-- include:callout-1 -->

<!-- include:benefits -->

<!-- include:callout-2 -->

<!-- include:brands -->

<!-- include:how-it-works -->

<!-- include:service-area -->

<!-- include:faq -->
        </div>

<!-- include:sidebar -->
      </div>
    </section>

    <div class="section-divider" role="presentation"></div>

<!-- include:final-cta -->
  </main>

<!-- include:footer -->

<!-- include:mobile-bar -->

  <script type="module" src="js/main.js"></script>
</body>
</html>
