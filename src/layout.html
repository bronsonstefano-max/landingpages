<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Header + hero CSS, inlined so first paint never waits on a network
       round trip for css/main.css. Generated from the same source files
       (see CRITICAL_CSS_FILES in scripts/build.py) — edit those, not this
       block, then rerun the build. -->
  <style>{{criticalCss}}</style>

  <!-- The hero background is the LCP element, so it is preloaded at high
       priority. Two sizes, media-gated so a phone never fetches the 1672px
       desktop file; these must stay in sync with the matching
       `max-width: 959px` rule in css/sections/hero.css. AVIF, not WebP —
       that's what the image-set() in hero.css actually picks for any
       browser that can decode it (smaller file, same visual quality); the
       `type` attribute makes a browser that can't decode AVIF skip this
       preload entirely rather than fetch a file it won't end up using. -->
  <link
    rel="preload"
    as="image"
    href="assets/images/hero-repair-mobile.avif"
    type="image/avif"
    fetchpriority="high"
    media="(max-width: 959px)"
  />
  <link
    rel="preload"
    as="image"
    href="assets/images/hero-repair.avif"
    type="image/avif"
    fetchpriority="high"
    media="(min-width: 960px)"
  />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/poppins-latin-400.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/poppins-latin-700.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/poppins-latin-800.woff2" crossorigin />

  <!-- The full stylesheet (everything the inlined block above already
       covers, plus every section further down the page). Loaded as
       non-blocking: the browser fetches it at low priority under a media
       it doesn't currently match, then swaps it to "all" once it lands, so
       it never competes with the hero image/fonts for bandwidth on the
       way to first paint. -->
  <link rel="stylesheet" href="css/main.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="css/main.css" /></noscript>

  <!-- main.js's imports, so the browser fetches the whole module graph in
       one parallel wave instead of discovering it one parse-step later.
       Low priority: none of this runs before first paint, so it shouldn't
       compete with the hero image/fonts/CSS for bandwidth. -->
  <link rel="modulepreload" href="js/config.js" fetchpriority="low" />
  <link rel="modulepreload" href="js/modules/bind-config.js" fetchpriority="low" />
  <link rel="modulepreload" href="js/modules/geo-location.js" fetchpriority="low" />
  <link rel="modulepreload" href="js/modules/service-area-map.js" fetchpriority="low" />
  <link rel="modulepreload" href="js/modules/local-number.js" fetchpriority="low" />
  <link rel="modulepreload" href="js/modules/star-rating.js" fetchpriority="low" />
  <link rel="modulepreload" href="js/modules/mobile-call-bar.js" fetchpriority="low" />
  <link rel="modulepreload" href="js/modules/call-tracking.js" fetchpriority="low" />
  <link rel="modulepreload" href="js/modules/call-by.js" fetchpriority="low" />

  <title>{{seo.title}}</title>
  <meta name="description" content="{{seo.description}}" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="{{seo.canonicalUrl}}" />
  <meta name="theme-color" content="#1657ff" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="assets/images/favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{seo.siteName}}" />
  <meta property="og:locale" content="{{seo.locale}}" />
  <meta property="og:title" content="{{seo.title}}" />
  <meta property="og:description" content="{{seo.description}}" />
  <meta property="og:url" content="{{seo.canonicalUrl}}" />
  <meta property="og:image" content="{{seo.ogImageUrl}}" />
  <meta property="og:image:secure_url" content="{{seo.ogImageUrl}}" />
  <meta property="og:image:type" content="{{seo.ogImageType}}" />
  <meta property="og:image:width" content="{{seo.ogImageWidth}}" />
  <meta property="og:image:height" content="{{seo.ogImageHeight}}" />
  <meta property="og:image:alt" content="{{seo.ogImageAlt}}" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{seo.title}}" />
  <meta name="twitter:description" content="{{seo.description}}" />
  <meta name="twitter:image" content="{{seo.ogImageUrl}}" />
  <meta name="twitter:image:alt" content="{{seo.ogImageAlt}}" />

  <script type="application/ld+json">{{jsonLd}}</script>
</head>

</html>
