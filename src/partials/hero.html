    <section class="hero">
      <div class="container">
        <h1><span data-geo-location-prefix></span>Appliance Repair</h1>
        <p class="hero-location" data-geo-reveal hidden>
          <svg class="icon" aria-hidden="true"><use href="#icon-pin"></use></svg>
          <span data-geo-city-state></span>
        </p>
        <p class="hero-subhead">
          <span data-cfg="availabilityClaim">Same &amp; Next-Day Service Available</span>.
          Call us at
          <a
            id="hero-phone-link"
            class="header-phone-number"
            href="tel:+18005555555"
            data-cfg-href="phoneHref"
            data-call-source="hero-inline"
          ><span data-cfg="phoneDisplay">(800) 555-5555</span></a>.
        </p>

        <div class="hero-cta">
          <a
            id="hero-call-button"
            class="btn btn-pill"
            href="tel:+18005555555"
            data-cfg-href="phoneHref"
            data-call-source="hero"
          >
            Schedule Service
            <span class="btn-pill-icon" aria-hidden="true">
              <svg class="icon"><use href="#icon-arrow-right"></use></svg>
            </span>
          </a>
        </div>

        <div class="star-rating" data-star-rating role="img" aria-label="Rated 4.5 out of 5 stars"></div>

        <ul class="hero-checklist">
          {{heroChecklist}}
        </ul>
      </div>
    </section>
