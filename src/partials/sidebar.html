        <aside class="content-sidebar">
          <div class="sidebar-card">
            <img
              class="sidebar-card-photo"
              src="{{heroPhoto.src}}"
              srcset="{{heroPhoto.srcset}}"
              sizes="320px"
              width="{{heroPhoto.width}}"
              height="{{heroPhoto.height}}"
              alt=""
              loading="lazy"
              decoding="async"
            />
            <div class="sidebar-card-body">
              <p class="sidebar-card-eyebrow">Talk to someone now</p>
              <h3><span data-geo-location-prefix></span>Appliance Repair</h3>
              <p class="sidebar-card-sub">Need It Fixed Today? Call Now For Fast Service.</p>
              <a
                id="sidebar-call-button"
                class="btn-banner"
                href="tel:+18005555555"
                data-cfg-href="phoneHref"
                data-call-source="sidebar-card"
              >
                <svg class="icon icon-phone-shake" aria-hidden="true"><use href="#icon-phone"></use></svg>
                <span data-cfg="phoneDisplay">(800) 555-5555</span>
              </a>
            </div>
          </div>
        </aside>
